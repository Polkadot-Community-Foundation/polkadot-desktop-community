name: Setup Node
description: Install the Node.js version pinned by package.json, with the npm cache enabled.
runs:
  using: 'composite'
  steps:
    - name: 🤞 Use Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        cache: npm
        node-version-file: ./package.json
        node-version: 24

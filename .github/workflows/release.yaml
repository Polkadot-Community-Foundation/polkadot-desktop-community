name: Release (Paseo / DEV)

# Builds Polkadot Desktop installers for the PUBLIC PASEO testnet channel — the public
# DEV distribution — and publishes them on a v* tag. The Paseo network wiring is
# delivered at runtime from Firebase Remote Config (chains_v2 / dot_ns_config /
# ipfs_gateway_url / identity_backend_url) — this workflow only bakes the env-only values
# (.env.paseo) and the public Firebase client ids, then packages per-OS via
# electron-builder. BUILD_CHANNEL=dev gives the installers a distinct electron identity
# (com.polkadot.desktop.dev / "Polkadot Desktop Dev") so they install side-by-side with
# the prod/summit build (see config/index.js).
#
# Companion artifacts (prepared in summit-deployer-skills):
#   .env.paseo                                   (committed; env-only Paseo values +
#                                                 foundation Firebase web ids)
#   guides/_tools/paseo-remote-config.json       (the RC payload to publish in Firebase)
#   src/__checks__/paseo-config.spec.ts          (pre-deploy validator)
#
# Firebase client ids: the committed .env.paseo already carries the foundation web app's
# PUBLIC ids; repo VARIABLES (below) override them if set, but are optional now.
#   VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN, VITE_FIREBASE_PROJECT_ID,
#   VITE_FIREBASE_STORAGE_BUCKET, VITE_FIREBASE_MESSAGING_SENDER_ID, VITE_FIREBASE_APP_ID
# Optional SECRETS:
#   macOS signing/notarization: CERTIFICATE_OSX_APPLICATION (base64 .p12),
#     CERTIFICATE_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#     (all set → signed+notarized dmg; unset → unsigned build, Tier A handout)
#   SENTRY_DSN (optional crash reporting)
#   Auto-update feed: set repo var AUTO_UPDATE_URL + BUILD_SOURCE (github|s3) to enable.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Distinct electron identity for the public DEV distribution (config/index.js):
      # com.polkadot.desktop.dev / "Polkadot Desktop Dev", installable beside prod/summit.
      BUILD_CHANNEL: dev
      # NOTE: the public Firebase client id OVERRIDES (repo variables) are intentionally
      # NOT declared here at job scope. When a repo variable is unset, `${{ vars.X }}`
      # expands to an empty string; a job-level env var set to "" is exported into the
      # "Build renderer + main" step's process environment, and Vite gives process-env
      # vars precedence over .env files — so an empty VITE_FIREBASE_* would BLANK OUT the
      # public ids committed in .env.paseo and break Remote Config bootstrap. Instead the
      # overrides are scoped to the "Select Paseo env" step below, where `append_if_set`
      # only writes them when non-empty (see that step).
      AUTO_UPDATE_URL: ${{ vars.AUTO_UPDATE_URL }}
      BUILD_SOURCE: ${{ vars.BUILD_SOURCE }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      # true only when an Apple signing cert is configured — gates the mac sign+notarize path
      HAS_APPLE: ${{ secrets.CERTIFICATE_OSX_APPLICATION != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Node
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: npm ci

      # Select the Paseo channel. The committed .env.paseo already carries the foundation
      # Firebase web ids and the env-only values. Repo variables, when set, are appended
      # to override them (later keys win in dotenv); EMPTY repo vars are skipped so they
      # never blank out the committed public ids. Vite reads VITE_* from .env and the
      # process environment, so both the renderer and the electron main process agree.
      - name: Select Paseo env
        shell: bash
        # Firebase client-id overrides are scoped HERE (not at job level) so their empty
        # values — when the repo variables are unset — never reach the build step's process
        # env and clobber the .env.paseo public ids via Vite's process-env precedence.
        # append_if_set writes them to .env only when non-empty.
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          # WebRTC TURN static-auth-secret (sensitive) — injected from a repo secret so it
          # never lands in the committed .env. Scoped here (not job-level) for the same
          # reason as the Firebase ids: an empty value must not clobber the .env base.
          VITE_WEBRTC_TURN_SECRET: ${{ secrets.VITE_WEBRTC_TURN_SECRET }}
        run: |
          cp .env.paseo .env
          append_if_set() {
            # $1 = key, $2 = value; only override when the repo var is non-empty
            [ -n "$2" ] && echo "$1=$2" >> .env || true
          }
          append_if_set VITE_FIREBASE_API_KEY "${VITE_FIREBASE_API_KEY}"
          append_if_set VITE_FIREBASE_AUTH_DOMAIN "${VITE_FIREBASE_AUTH_DOMAIN}"
          append_if_set VITE_FIREBASE_PROJECT_ID "${VITE_FIREBASE_PROJECT_ID}"
          append_if_set VITE_FIREBASE_STORAGE_BUCKET "${VITE_FIREBASE_STORAGE_BUCKET}"
          append_if_set VITE_FIREBASE_MESSAGING_SENDER_ID "${VITE_FIREBASE_MESSAGING_SENDER_ID}"
          append_if_set VITE_FIREBASE_APP_ID "${VITE_FIREBASE_APP_ID}"
          append_if_set VITE_WEBRTC_TURN_SECRET "${VITE_WEBRTC_TURN_SECRET}"
          append_if_set AUTO_UPDATE_URL "${AUTO_UPDATE_URL}"
          append_if_set BUILD_SOURCE "${BUILD_SOURCE}"

      # ── macOS: import the Developer ID cert only when configured ──────────────────
      - name: Import signing certificate (macOS, signed path)
        if: ${{ matrix.os == 'macos-latest' && env.HAS_APPLE == 'true' }}
        env:
          CERTIFICATE_OSX_APPLICATION: ${{ secrets.CERTIFICATE_OSX_APPLICATION }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: sh .github/add_cert_in_keychain.sh

      - name: Build renderer + main
        run: npm run build && npm run postbuild

      # ── Package ──────────────────────────────────────────────────────────────────
      - name: Package (macOS, signed + notarized)
        if: ${{ matrix.os == 'macos-latest' && env.HAS_APPLE == 'true' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NODE_ENV: production
        run: npx electron-builder --config electron-builder.js -p never

      - name: Package (macOS, unsigned — Tier A)
        if: ${{ matrix.os == 'macos-latest' && env.HAS_APPLE != 'true' }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          NODE_ENV: production
        run: npx electron-builder --config electron-builder.js -p never -c.mac.notarize=false

      # Linux packages via npx under the default bash shell — works and produces the
      # AppImage. NODE_ENV is set via the step env block (dropping cross-env, which on
      # Windows exited 0 without running electron-builder — a silent no-op).
      - name: Package (Linux)
        if: ${{ matrix.os == 'ubuntu-latest' }}
        env:
          NODE_ENV: production
        run: npx electron-builder --config electron-builder.js -p never

      # Windows: the `npx electron-builder` indirection returns exit 0 WITHOUT packaging
      # on the windows runner (the job stayed green while no installer was produced — the
      # real root cause behind the missing windows artifact, which the cross-env drop did
      # not address). Invoke the electron-builder CLI directly via node so it actually
      # runs, then assert an .exe was produced so a future silent no-op fails the job.
      - name: Package (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        env:
          NODE_ENV: production
        run: |
          node node_modules\electron-builder\cli.js --config electron-builder.js -p never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-ChildItem release\dist -Filter *.exe -ErrorAction SilentlyContinue
          if (-not $exe) { Write-Error "electron-builder produced no .exe in release/dist"; exit 1 }
          Get-ChildItem release\dist | Format-Table Name,Length

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: polkadot-desktop-dev-${{ matrix.os }}
          path: |
            release/dist/*.dmg
            release/dist/*.zip
            release/dist/*.AppImage
            release/dist/*.exe
            release/dist/latest*.yml
          if-no-files-found: warn

      - name: Publish to GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            release/dist/*.dmg
            release/dist/*.zip
            release/dist/*.AppImage
            release/dist/*.exe
            release/dist/latest*.yml
          generate_release_notes: true

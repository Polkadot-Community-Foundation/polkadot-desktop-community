name: Release (Paseo / DEV)

# Devnet desktop release. A dispatch on `devnet` builds every platform, tags the commit
# `devnet/<YYYY-MM-DD>.<n>` and publishes a GitHub Release behind `tester-distribution`.
# A dispatch on any other branch only uploads the installers as run artifacts.
# Upstream's release-pipeline.yml and create-release-tag.yml are deleted on purpose (they
# publish unguarded builds); do not restore them.
# Keep the auto-update feed off: with it on, every devnet release that becomes Latest
# reaches every install.

on:
  workflow_dispatch:

permissions:
  contents: read

# Never cancel: a half-published release must finish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Secrets can't be read in a job-level `if:`, so whether mac signing is configured is an output.
  prepare:
    runs-on: ubuntu-latest
    environment: devnet
    outputs:
      signed: ${{ steps.detect.outputs.signed }}
    steps:
      - id: detect
        shell: bash
        env:
          HAS_APPLE: ${{ secrets.CERTIFICATE_OSX_APPLICATION != '' }}
        run: echo "signed=${HAS_APPLE}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    environment: devnet
    env:
      # Packaging identity: config/index.js refuses to package without it.
      BUILD_TYPE: ${{ vars.BUILD_TYPE || 'dev' }}
      APP_ID_DEVELOP: ${{ vars.APP_ID_DEVELOP || 'com.polkadot.desktop.dev' }}
      PRODUCT_NAME_DEVELOP: ${{ vars.PRODUCT_NAME_DEVELOP || 'Polkadot Desktop Dev' }}
      # Must stay `polkadot-desktop`: Electron derives the userData directory from it, and every
      # existing install's profile lives there.
      APP_NAME_DEVELOP: ${{ vars.APP_NAME_DEVELOP || 'polkadot-desktop' }}
      APP_ID: ${{ vars.APP_ID || 'com.polkadot.desktop' }}
      PRODUCT_NAME: ${{ vars.PRODUCT_NAME || 'Polkadot Desktop' }}
      APP_NAME: ${{ vars.APP_NAME || 'polkadot-desktop' }}
      # Unset, config/index.js points the update feed at Parity's repository.
      UPDATE_REPO_OWNER: ${{ vars.UPDATE_REPO_OWNER || github.repository_owner }}
      UPDATE_REPO_NAME: ${{ vars.UPDATE_REPO_NAME || github.event.repository.name }}
      # VITE_* stay step-scoped: Vite prefers process env over .env, so an unset variable
      # here would blank the value written to .env.
      AUTO_UPDATE_URL: ${{ vars.AUTO_UPDATE_URL }}
      BUILD_SOURCE: ${{ vars.BUILD_SOURCE }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      HAS_APPLE: ${{ needs.prepare.outputs.signed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Node
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: npm ci

      # Each key is written only when non-empty; values reach the script through env only.
      - name: Generate .env
        shell: bash
        env:
          VITE_ENVIRONMENTS: ${{ vars.VITE_ENVIRONMENTS }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_WEBRTC_TURN_HOST: ${{ vars.VITE_WEBRTC_TURN_HOST }}
          VITE_WEBRTC_TURN_TTL: ${{ vars.VITE_WEBRTC_TURN_TTL }}
          SANDBOX_IPFS_ALLOWLIST: ${{ vars.SANDBOX_IPFS_ALLOWLIST }}
          SANDBOX_RELAY_ALLOWLIST: ${{ vars.SANDBOX_RELAY_ALLOWLIST }}
          VITE_WEBRTC_TURN_SECRET: ${{ secrets.VITE_WEBRTC_TURN_SECRET }}
        run: |
          set -euo pipefail
          umask 077
          : > .env
          write() {
            local val="${!1-}"
            [ -n "${val}" ] && printf '%s=%s\n' "$1" "${val}" >> .env || true
          }
          write VITE_ENVIRONMENTS
          write VITE_FIREBASE_API_KEY
          write VITE_FIREBASE_AUTH_DOMAIN
          write VITE_FIREBASE_PROJECT_ID
          write VITE_FIREBASE_STORAGE_BUCKET
          write VITE_FIREBASE_MESSAGING_SENDER_ID
          write VITE_FIREBASE_APP_ID
          write VITE_WEBRTC_TURN_HOST
          write VITE_WEBRTC_TURN_TTL
          write VITE_WEBRTC_TURN_SECRET
          write SANDBOX_IPFS_ALLOWLIST
          write SANDBOX_RELAY_ALLOWLIST
          write AUTO_UPDATE_URL
          write BUILD_SOURCE
          echo "Wrote .env with $(grep -c '=' .env) keys."

      # Fails on more than one network channel or missing Firebase ids.
      - name: Validate release config
        shell: bash
        run: node scripts/validate-release-env.mjs .env

      - name: Import signing certificate (macOS, signed path)
        if: ${{ matrix.os == 'macos-latest' && env.HAS_APPLE == 'true' }}
        env:
          CERTIFICATE_OSX_APPLICATION: ${{ secrets.CERTIFICATE_OSX_APPLICATION }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: sh .github/add_cert_in_keychain.sh

      - name: Build renderer + main
        run: npm run build && npm run postbuild

      - name: Package (macOS, signed + notarized)
        if: ${{ matrix.os == 'macos-latest' && env.HAS_APPLE == 'true' }}
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          NODE_ENV: production
        run: |
          set -euo pipefail
          umask 077
          KEY_PATH="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "${APPLE_API_KEY_P8_BASE64}" | base64 --decode > "${KEY_PATH}"
          export APPLE_API_KEY="${KEY_PATH}"
          trap 'rm -f "${KEY_PATH}"' EXIT
          npx electron-builder --config electron-builder.js -p never

      - name: Package (macOS, unsigned — Tier A)
        if: ${{ matrix.os == 'macos-latest' && env.HAS_APPLE != 'true' }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          NODE_ENV: production
        run: npx electron-builder --config electron-builder.js -p never -c.mac.notarize=false

      - name: Package (Linux)
        if: ${{ matrix.os == 'ubuntu-latest' }}
        env:
          NODE_ENV: production
        run: npx electron-builder --config electron-builder.js -p never

      # `npx electron-builder` exits 0 without packaging on Windows: call the CLI directly and
      # assert an .exe was produced.
      - name: Package (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        env:
          NODE_ENV: production
        run: |
          node node_modules\electron-builder\cli.js --config electron-builder.js -p never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-ChildItem release\dist -Filter *.exe -ErrorAction SilentlyContinue
          if (-not $exe) { Write-Error "electron-builder produced no .exe in release/dist"; exit 1 }
          Get-ChildItem release\dist | Format-Table Name,Length

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: polkadot-desktop-dev-${{ matrix.os }}
          path: |
            release/dist/*.dmg
            release/dist/*.zip
            release/dist/*.AppImage
            release/dist/*.exe
            release/dist/latest*.yml
          if-no-files-found: warn

  # Tags before the approval gate, so a rejected publish still records what was built.
  tag:
    needs: build
    if: github.ref == 'refs/heads/devnet'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Tag the built commit
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          LAST=$(git ls-remote --tags origin "refs/tags/devnet/${DATE}.*" \
            | sed -n "s#.*refs/tags/devnet/${DATE}\.\([0-9]*\)\$#\1#p" | sort -n | tail -1)
          TAG="devnet/${DATE}.$(( ${LAST:-0} + 1 ))"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "Desktop devnet build ${GITHUB_RUN_NUMBER} (run ${GITHUB_RUN_ID})"
          git push origin "refs/tags/$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "### Tagged \`$TAG\` at ${GITHUB_SHA:0:8}" >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: [prepare, build, tag]
    if: github.ref == 'refs/heads/devnet'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One publisher after every platform built. The approval gate lives in the environment.
    environment:
      name: tester-distribution
      url: ${{ github.server_url }}/${{ github.repository }}/releases
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          pattern: polkadot-desktop-dev-*
          merge-multiple: true
          path: dist

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          files=(*.dmg *.zip *.AppImage *.exe)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No installers found to publish" >&2
            exit 1
          fi
          sha256sum "${files[@]}" | tee SHA256SUMS.txt

      # A semver pre-release (0.1.4-rc.1) is published as a pre-release, never Latest.
      - name: Resolve release channel
        id: channel
        shell: bash
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          PRERELEASE=false
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE=true
          fi
          {
            echo "tag=${TAG}"
            echo "name=v${VERSION} (${TAG})"
            echo "prerelease=${PRERELEASE}"
          } >> "$GITHUB_OUTPUT"

      # Unsigned mac builds get the Gatekeeper workaround in the notes.
      - name: Compose release notes
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "Polkadot Desktop devnet build — commit \`${GITHUB_SHA:0:8}\`, run ${GITHUB_RUN_NUMBER}."
            echo
            echo "This is a **devnet** build for testing only; state may be wiped. Found a"
            echo "problem? [Report it](https://github.com/Polkadot-Community-Foundation/products-devnet-issues/issues/new/choose)."
            echo
          } > NOTES.md
          if [ "${{ needs.prepare.outputs.signed }}" != "true" ]; then
            cat .github/release-notes-macos-unsigned.md >> NOTES.md
          fi

      - name: Publish to GitHub Release
        # v2, pinned to a commit.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ steps.channel.outputs.tag }}
          name: ${{ steps.channel.outputs.name }}
          prerelease: ${{ steps.channel.outputs.prerelease }}
          make_latest: ${{ steps.channel.outputs.prerelease == 'true' && 'false' || 'true' }}
          body_path: NOTES.md
          # latest*.yml exists only with an update feed; the checksum step guarantees installers.
          fail_on_unmatched_files: false
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.exe
            dist/latest*.yml
            dist/SHA256SUMS.txt
          generate_release_notes: true

name: Build (Production)

# Builds a PRODUCTION-CONFIGURED Polkadot Desktop installer and PUBLISHES NOTHING.
#
# This is PCF-232 / PCF-239. It exists beside `release.yaml` (the DEV/devnet lane) rather
# than inside it, because that lane is load-bearing today and a shared file is a shared
# blast radius. The two lanes must be runnable AT THE SAME TIME, so everything that could
# collide is different here: the concurrency group, the output location, and the packaged
# application identity.
#
# ── Private output ───────────────────────────────────────────────────────────────────
# This repository is public, and its Actions artifacts can be downloaded by any signed-in
# GitHub user, so this lane uploads NO Actions artifact. Installers go to a private Cloud
# Storage bucket (`vars.BUILD_BUCKET`, prefix `desktop/<run>/<os>/`) through a keyless
# sign-in (GitHub OIDC -> Workload Identity Federation) that is only issued to this
# repository's production environments and can only create and read under `desktop/`.
# `build-app` is called with `upload_build_output: 'false'` so the compiled bundle is not
# uploaded either.
#
# ── What this workflow does NOT do ───────────────────────────────────────────────────
#   - no GitHub Release (there is no `softprops/action-gh-release` step, and
#     `permissions: contents: read` means the job COULD not create one if it tried);
#   - no auto-update feed publication — every electron-builder invocation passes
#     `-p never`, ENABLE_AUTO_UPDATE is left false, and the generated `latest*.yml`
#     update metadata is deliberately NOT uploaded (see "Upload installers" below);
#   - no store, TestFlight, Firebase App Distribution, R2 or S3 upload of any kind;
#   - no `push`, `schedule` or `pull_request` trigger. `workflow_dispatch` only, which is
#     the single strongest guarantee that nothing ships by accident.
#
# ── The two-environment model (PCF-239) ──────────────────────────────────────────────
# `production`              UNGATED. Holds production *configuration* — application ids,
#                           product names, the channel catalog, Firebase web ids, the
#                           update-feed owner. All of it ships inside the artifact and is
#                           public. Declared by the `config` job below, which exports it as
#                           job outputs.
# `production-distribution` GATED (required reviewers). Holds the signing material — the
#                           Cloud KMS key ring and alias, the certificate chain, the signing
#                           service account. Declared by the `build` job, but ONLY when it
#                           is dispatched with `signing: production`.
#
# Signing has to happen INSIDE the build: electron-builder signs the application executable
# before NSIS wraps it, so an installer signed afterwards would carry an unsigned program.
# A job declares exactly one environment, so the build cannot read configuration from
# `production` and signing material from `production-distribution` at the same time. The
# configuration is public by definition — every value ships inside the installer — so it
# travels as job outputs from the ungated `config` job, and the build switches its own
# environment to the gated one when, and only when, it signs. An unsigned production build
# still needs no approval click.
#
# Windows signs through Cloud HSM (jsign + Cloud KMS, see scripts/sign-windows-kms.js): the
# private key is generated in hardware and cannot be exported, so the runner holds nothing
# but a one-hour token. macOS stays unsigned until PCF holds an Apple Developer ID (PCF-29),
# Linux until a GPG signing key exists; both say so in the run summary.
#
# ── Lane isolation, verifiable ───────────────────────────────────────────────────────
# GitHub resolves `vars.X` as ENVIRONMENT, then repository, then organisation. `release.yaml`
# declares no environment on its `build` job, so it keeps reading the repository-level
# variables it reads today; this job declares `environment: production` and reads the
# production ones. NOTHING production-shaped may ever be set at repository level — the live
# trap is `release.yaml:163`, `BUILD_TYPE: ${{ vars.BUILD_TYPE || 'dev' }}`, where a
# repo-level `BUILD_TYPE=production` would silently flip the DEVNET lane to production
# packaging.
#
#   concurrency group   build-production-<ref>        (devnet lane: release-<ref>)
#   installers          polkadot-desktop-production-* (devnet lane: polkadot-desktop-dev-*)
#   compiled bundle     not uploaded                  (build-pr lane: build-output-<OS>)
#   application id      vars.APP_ID                   (devnet lane: APP_ID_DEVELOP,
#                                                      com.polkadot.desktop.dev)
#
# ── Configuration source ─────────────────────────────────────────────────────────────
# Everything comes from `production` environment Variables. Unlike `release.yaml` this
# workflow writes NO `.env`: `.github/actions/build-app` injects every value through a step
# `env:` block, and `scripts/validate-release-env.mjs` reads `process.env` overlaid on the
# file — which is the case its own docstring calls out — so the guard validates exactly the
# values the compiler will see. There is deliberately NO fallback for the identity or the
# catalog: a production build that guessed a bundle id would install beside the application
# it meant to replace, silently. The preflight step below fails by name instead.
#
# See guides/production/builds/desktop.md in Polkadot-Community-Foundation/summit-deployer-skills
# for the variable list, the `gh` commands that create the two environments, and the
# auto-update position.

on:
  workflow_dispatch:
    inputs:
      signing:
        type: choice
        description: >-
          none = unsigned artifacts (the only thing possible today).
          production = require real signing material from the gated
          production-distribution environment; fails by name until PCF-29 lands.
        options:
          - none
          - production
        default: none
      ref:
        type: string
        description: Git ref to build (branch, tag or SHA). Defaults to the ref this workflow was dispatched on.
        required: false

# Read-only. A production build reads the repository and writes artifacts; it has no
# business creating a release, a tag, a comment or a deployment status, and this is the
# mechanical proof that it cannot.
permissions:
  contents: read

# Distinct from the devnet lane's `release-${{ github.ref }}`, so a production run can
# never cancel or queue behind a devnet run. Not cancel-in-progress: a long packaging run
# should finish rather than be aborted by a second dispatch.
concurrency:
  group: build-production-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

env:
  # Uploads to the private bucket must not use parallel composite uploads: their temporary parts live outside
  # this repository's prefix and need delete to clean up, which the build identity deliberately lacks.
  CLOUDSDK_STORAGE_PARALLEL_COMPOSITE_UPLOAD_ENABLED: "False"

jobs:
  # Production CONFIGURATION, read once and handed to the build as job outputs. Every value here
  # ships inside the installer and is public, so passing it through outputs leaks nothing — and it
  # is what lets the build job declare the GATED environment when it signs (a job has exactly one
  # `environment:`, and the signing material and the configuration live in different ones).
  config:
    name: Production configuration
    runs-on: ubuntu-latest
    environment: production
    outputs:
      app_id: ${{ steps.export.outputs.app_id }}
      product_name: ${{ steps.export.outputs.product_name }}
      app_name: ${{ steps.export.outputs.app_name }}
      app_author: ${{ steps.export.outputs.app_author }}
      environments: ${{ steps.export.outputs.environments }}
      firebase_api_key: ${{ steps.export.outputs.firebase_api_key }}
      firebase_project_id: ${{ steps.export.outputs.firebase_project_id }}
      firebase_app_id: ${{ steps.export.outputs.firebase_app_id }}
      expected_channel: ${{ steps.export.outputs.expected_channel }}
      update_repo_owner: ${{ steps.export.outputs.update_repo_owner }}
      update_repo_name: ${{ steps.export.outputs.update_repo_name }}
      turn_host: ${{ steps.export.outputs.turn_host }}
      turn_ttl: ${{ steps.export.outputs.turn_ttl }}
      sandbox_ipfs_allowlist: ${{ steps.export.outputs.sandbox_ipfs_allowlist }}
      sandbox_relay_allowlist: ${{ steps.export.outputs.sandbox_relay_allowlist }}
      build_bucket: ${{ steps.export.outputs.build_bucket }}
      wif_provider: ${{ steps.export.outputs.wif_provider }}
      service_account: ${{ steps.export.outputs.service_account }}
    steps:
      # Fail here, naming every missing variable, rather than forty minutes later inside
      # electron-builder or at the upload with nowhere private to put the installers.
      - name: Export the production configuration
        id: export
        shell: bash
        env:
          APP_ID: ${{ vars.APP_ID }}
          PRODUCT_NAME: ${{ vars.PRODUCT_NAME }}
          APP_NAME: ${{ vars.APP_NAME }}
          APP_AUTHOR: ${{ vars.APP_AUTHOR }}
          VITE_ENVIRONMENTS: ${{ vars.VITE_ENVIRONMENTS }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          EXPECTED_CHANNEL: ${{ vars.PRODUCTION_CHANNEL_ID || 'polkadot' }}
          UPDATE_REPO_OWNER: ${{ vars.UPDATE_REPO_OWNER || github.repository_owner }}
          UPDATE_REPO_NAME: ${{ vars.UPDATE_REPO_NAME || github.event.repository.name }}
          VITE_WEBRTC_TURN_HOST: ${{ vars.VITE_WEBRTC_TURN_HOST }}
          VITE_WEBRTC_TURN_TTL: ${{ vars.VITE_WEBRTC_TURN_TTL }}
          SANDBOX_IPFS_ALLOWLIST: ${{ vars.SANDBOX_IPFS_ALLOWLIST }}
          SANDBOX_RELAY_ALLOWLIST: ${{ vars.SANDBOX_RELAY_ALLOWLIST }}
          BUILD_BUCKET: ${{ vars.BUILD_BUCKET }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          missing=()
          for name in APP_ID PRODUCT_NAME APP_NAME APP_AUTHOR VITE_ENVIRONMENTS \
                      VITE_FIREBASE_API_KEY VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_APP_ID \
                      BUILD_BUCKET GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT; do
            [ -z "${!name-}" ] && missing+=("${name}")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            {
              echo "### ❌ the \`production\` environment is missing configuration"
              echo
              for name in "${missing[@]}"; do echo "- \`${name}\`"; done
              echo
              echo "These are environment Variables, never repository Variables — a repo-level"
              echo "value would leak into the devnet lane in \`release.yaml\`."
            } | tee -a "$GITHUB_STEP_SUMMARY" >&2
            exit 1
          fi
          emit() {
            printf '%s<<__PCF_EOF__\n%s\n__PCF_EOF__\n' "$1" "${2-}" >> "$GITHUB_OUTPUT"
          }
          emit app_id "${APP_ID}"
          emit product_name "${PRODUCT_NAME}"
          emit app_name "${APP_NAME}"
          emit app_author "${APP_AUTHOR}"
          emit environments "${VITE_ENVIRONMENTS}"
          emit firebase_api_key "${VITE_FIREBASE_API_KEY}"
          emit firebase_project_id "${VITE_FIREBASE_PROJECT_ID}"
          emit firebase_app_id "${VITE_FIREBASE_APP_ID}"
          emit expected_channel "${EXPECTED_CHANNEL}"
          emit update_repo_owner "${UPDATE_REPO_OWNER}"
          emit update_repo_name "${UPDATE_REPO_NAME}"
          emit turn_host "${VITE_WEBRTC_TURN_HOST}"
          emit turn_ttl "${VITE_WEBRTC_TURN_TTL}"
          emit sandbox_ipfs_allowlist "${SANDBOX_IPFS_ALLOWLIST}"
          emit sandbox_relay_allowlist "${SANDBOX_RELAY_ALLOWLIST}"
          emit build_bucket "${BUILD_BUCKET}"
          emit wif_provider "${GCP_WORKLOAD_IDENTITY_PROVIDER}"
          emit service_account "${GCP_SERVICE_ACCOUNT}"
          echo "Production configuration present."

  build:
    name: Build (${{ matrix.os }})
    needs: config
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # GATED only when it signs. `signing: none` runs in the ungated `production` environment and
    # needs no approval; `signing: production` runs in `production-distribution`, so a reviewer
    # approves before the build can reach any signing key. Configuration comes from `needs.config`
    # either way, so the gated run is not missing anything the ungated one had.
    environment: ${{ inputs.signing == 'production' && 'production-distribution' || 'production' }}
    permissions:
      contents: read
      id-token: write
    env:
      # ── Packaged application identity. No fallbacks: see the header. ─────────────
      APP_ID: ${{ needs.config.outputs.app_id }}
      PRODUCT_NAME: ${{ needs.config.outputs.product_name }}
      APP_NAME: ${{ needs.config.outputs.app_name }}
      APP_AUTHOR: ${{ needs.config.outputs.app_author }}
      # ── Channel catalog + public Firebase web ids ────────────────────────────────
      VITE_ENVIRONMENTS: ${{ needs.config.outputs.environments }}
      VITE_FIREBASE_API_KEY: ${{ needs.config.outputs.firebase_api_key }}
      VITE_FIREBASE_PROJECT_ID: ${{ needs.config.outputs.firebase_project_id }}
      VITE_FIREBASE_APP_ID: ${{ needs.config.outputs.firebase_app_id }}
      # The channel id the guard pins the catalog to. A production build must ship exactly
      # one channel AND it must be the production one — a catalog that validly contains a
      # single *devnet* channel would otherwise sail through.
      EXPECTED_CHANNEL: ${{ needs.config.outputs.expected_channel }}
    steps:
      # Installers go to a private bucket. Refuse to build without one.
      - name: Require the private output configuration
        shell: bash
        env:
          BUILD_BUCKET: ${{ needs.config.outputs.build_bucket }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ needs.config.outputs.wif_provider }}
          GCP_SERVICE_ACCOUNT: ${{ needs.config.outputs.service_account }}
        run: |
          missing=0
          for name in BUILD_BUCKET GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set in the production environment; refusing to build without a private output"
              missing=1
            fi
          done
          exit "$missing"
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}

      # The configuration arrives as job outputs, so assert it survived the hand-off rather than
      # discovering an empty application id inside electron-builder.
      - name: Preflight — production configuration present
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in APP_ID PRODUCT_NAME APP_NAME VITE_ENVIRONMENTS \
                      VITE_FIREBASE_API_KEY VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_APP_ID; do
            [ -z "${!name-}" ] && missing+=("${name}")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            printf '::error::empty after the config hand-off: %s\n' "${missing[*]}"
            exit 1
          fi
          echo "Production configuration present."

      # What `signing: production` can actually sign today. Windows signs through Cloud HSM;
      # macOS needs an Apple Developer ID (PCF-29) and Linux a detached GPG signature, neither of
      # which exists yet, so those two stay unsigned and say so rather than failing the build.
      - name: Signing material preflight
        if: ${{ inputs.signing == 'production' }}
        shell: bash
        env:
          KEYSTORE: ${{ vars.WINDOWS_CODESIGN_KEYSTORE }}
          ALIAS: ${{ vars.WINDOWS_CODESIGN_ALIAS }}
          CERT_CHAIN: ${{ vars.WINDOWS_CODESIGN_CERT_CHAIN }}
          SIGNER_SERVICE_ACCOUNT: ${{ vars.WINDOWS_CODESIGN_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ "${RUNNER_OS}" != "Windows" ]; then
            echo "::warning::${RUNNER_OS} artifacts are UNSIGNED — no Apple Developer ID (PCF-29), no Linux GPG key yet"
            exit 0
          fi
          missing=()
          for name in KEYSTORE ALIAS CERT_CHAIN SIGNER_SERVICE_ACCOUNT; do
            [ -z "${!name-}" ] && missing+=("WINDOWS_CODESIGN_${name}")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            {
              echo "### ❌ signing: production — Windows signing material is missing"
              echo
              echo "Not present in the \`production-distribution\` environment:"
              for name in "${missing[@]}"; do echo "- \`${name}\`"; done
              echo
              echo "The HSM key exists (terraform/production/client_signing.tf); the certificate"
              echo "chain is issued by a CA against that key. Re-run with \`signing: none\` for an"
              echo "unsigned production build."
            } | tee -a "$GITHUB_STEP_SUMMARY" >&2
            exit 1
          fi
          echo "Windows signing material present."

      - name: Node
        uses: ./.github/actions/setup-node

      # The deterministic backstop, run BEFORE the build rather than after: exactly one
      # network channel (more than one renders the network chooser to end users), that
      # channel is the declared default AND is the expected production channel, and the
      # three Firebase web ids Remote Config bootstraps from are non-empty.
      #
      # No `.env` exists in this lane, which the guard handles: it overlays `process.env`
      # on the file and a missing file is only fatal when the environment carries no
      # catalog either. `.env` is passed as the path purely to keep the call identical to
      # the devnet lane's.
      - name: Validate release config
        shell: bash
        run: node scripts/validate-release-env.mjs .env "${EXPECTED_CHANNEL}"

      # Compile the production bundles through the repository's own composite action:
      # `build_type: production` takes the `npm run r clean:build clean:prod build postbuild`
      # path (vite --mode production), which is what sets isProductionBuild() and so closes
      # the onboarding network chooser and the Skip button, and what makes
      # electron-builder.js pick the production icon rather than the white DEV tile.
      #
      # `include_dist_artifacts` is deliberately FALSE — packaging is done in the explicit
      # steps below rather than through the action's `npm run dist`, for two reasons the
      # devnet lane already learned the hard way:
      #   1. the unsigned macOS path needs `-c.mac.notarize=false`, which is a CLI-only
      #      override `npm run dist` cannot express (electron-builder.js hardcodes
      #      `notarize: true`);
      #   2. `npm run dist` goes through cross-env, which on the Windows runner exits 0
      #      WITHOUT packaging — the silent no-op `release.yaml:324-328` documents.
      # `npm run dist` does pass `-p never` itself, so nothing is lost on the publishing side.
      - name: Build application (production configuration)
        uses: ./.github/actions/build-app
        with:
          build_type: production
          # Auto-update stays OFF. There is no production release for a feed to point at
          # yet, and the desktop's updater gate is `ENABLE_AUTO_UPDATE === 'true'` AND a
          # configured feed — so an installed build from this lane honestly reports that it
          # cannot self-update instead of polling a feed that does not exist.
          enable_auto_update: 'false'
          # config/index.js defaults the GitHub update feed to paritytech/polkadot-desktop-
          # community. Even with the updater off, the feed owner is baked into the packaged
          # config, so pin it to PCF's repository: a build that ever has auto-update turned
          # on must not offer Parity's releases to PCF's users.
          update_repo_owner: ${{ needs.config.outputs.update_repo_owner }}
          update_repo_name: ${{ needs.config.outputs.update_repo_name }}
          app_id: ${{ needs.config.outputs.app_id }}
          product_name: ${{ needs.config.outputs.product_name }}
          app_name: ${{ needs.config.outputs.app_name }}
          app_author: ${{ needs.config.outputs.app_author }}
          # The `_DEVELOP` identity is left empty on purpose. BUILD_TYPE=production never
          # reads it, and passing it would invite a future edit to make this lane packageable
          # as dev.
          environments: ${{ needs.config.outputs.environments }}
          firebase_api_key: ${{ needs.config.outputs.firebase_api_key }}
          firebase_project_id: ${{ needs.config.outputs.firebase_project_id }}
          firebase_app_id: ${{ needs.config.outputs.firebase_app_id }}
          webrtc_turn_host: ${{ needs.config.outputs.turn_host }}
          webrtc_turn_secret: ${{ secrets.VITE_WEBRTC_TURN_SECRET }}
          webrtc_turn_ttl: ${{ needs.config.outputs.turn_ttl }}
          sandbox_ipfs_allowlist: ${{ needs.config.outputs.sandbox_ipfs_allowlist }}
          sandbox_relay_allowlist: ${{ needs.config.outputs.sandbox_relay_allowlist }}
          sentry_dsn: ${{ secrets.SENTRY_DSN }}
          sentry_required: 'false'
          include_dist_artifacts: false
          # The compiled bundle carries every production value; never an Actions artifact.
          upload_build_output: 'false'
          artifact_suffix: production-${{ runner.os }}

      # ── Windows signing material. Windows runner, `signing: production` only. ───
      # The private key never leaves Cloud HSM; what is acquired here is a certificate chain
      # (public), a jar, and an access token that expires in an hour.
      - name: Java (jsign runtime)
        if: ${{ inputs.signing == 'production' && matrix.os == 'windows-latest' }}
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Fetch jsign
        if: ${{ inputs.signing == 'production' && matrix.os == 'windows-latest' }}
        shell: pwsh
        env:
          JSIGN_VERSION: '7.5'
          JSIGN_SHA256: 602a51c3545a6dc4fb99bd2ea7152b26d1345916d0c93ddfbd5936cb735af91c
        run: |
          $jar = Join-Path $env:RUNNER_TEMP "jsign.jar"
          Invoke-WebRequest -Uri "https://github.com/ebourg/jsign/releases/download/$env:JSIGN_VERSION/jsign-$env:JSIGN_VERSION.jar" -OutFile $jar
          $actual = (Get-FileHash $jar -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $env:JSIGN_SHA256) { Write-Error "jsign checksum mismatch: $actual"; exit 1 }
          "JSIGN_JAR=$jar" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Write the certificate chain
        if: ${{ inputs.signing == 'production' && matrix.os == 'windows-latest' }}
        shell: pwsh
        env:
          CERT_CHAIN: ${{ vars.WINDOWS_CODESIGN_CERT_CHAIN }}
        run: |
          $file = Join-Path $env:RUNNER_TEMP "codesign-chain.pem"
          Set-Content -Path $file -Value $env:CERT_CHAIN -Encoding ascii
          "WINDOWS_CODESIGN_CERT_FILE=$file" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # A second, separate identity: this one may sign with the key and do nothing else, and its
      # federation binding accepts only this repository running in `production-distribution`.
      # The upload identity is acquired later and overwrites these credentials, which is fine —
      # jsign uses the token captured here.
      - name: Authenticate as the signing identity
        id: signer-auth
        if: ${{ inputs.signing == 'production' && matrix.os == 'windows-latest' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ needs.config.outputs.wif_provider }}
          service_account: ${{ vars.WINDOWS_CODESIGN_SERVICE_ACCOUNT }}
          token_format: access_token

      # ── Package. Every invocation carries `-p never`. ────────────────────────────
      # macOS, unsigned — the only macOS path that exists today (PCF-29). Identical to the
      # devnet lane's Tier A path: CSC_IDENTITY_AUTO_DISCOVERY=false stops electron-builder
      # picking up whatever identity happens to be in the runner keychain, and
      # `-c.mac.notarize=false` overrides the hardcoded `notarize: true`.
      - name: Package (macOS, unsigned)
        if: ${{ matrix.os == 'macos-latest' }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          NODE_ENV: production
        run: npx electron-builder --config electron-builder.js -p never -c.mac.notarize=false

      - name: Package (Linux)
        if: ${{ matrix.os == 'ubuntu-latest' }}
        env:
          NODE_ENV: production
        run: npx electron-builder --config electron-builder.js -p never

      # Windows invokes the electron-builder CLI directly via node: the `npx` indirection
      # returns exit 0 WITHOUT packaging on the windows runner, so the assertion below is
      # what stops a green job that produced no installer.
      - name: Package (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        env:
          NODE_ENV: production
          # Unset for `signing: none`, which is what leaves `win.signtoolOptions` undefined in
          # electron-builder.js and packages unsigned.
          WINDOWS_CODESIGN_KEYSTORE: ${{ inputs.signing == 'production' && vars.WINDOWS_CODESIGN_KEYSTORE || '' }}
          WINDOWS_CODESIGN_ALIAS: ${{ vars.WINDOWS_CODESIGN_ALIAS }}
          WINDOWS_CODESIGN_TOKEN: ${{ steps.signer-auth.outputs.access_token }}
          WINDOWS_CODESIGN_TSA: ${{ vars.WINDOWS_CODESIGN_TSA }}
        run: |
          node node_modules\electron-builder\cli.js --config electron-builder.js -p never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-ChildItem release\dist -Filter *.exe -ErrorAction SilentlyContinue
          if (-not $exe) { Write-Error "electron-builder produced no .exe in release/dist"; exit 1 }
          Get-ChildItem release\dist | Format-Table Name,Length

      # Trust the operating system's own verdict rather than jsign's exit code: an installer that
      # packaged cleanly but carries an unverifiable signature is exactly the artifact worth
      # stopping here.
      - name: Verify the Authenticode signature
        if: ${{ inputs.signing == 'production' && matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem release\dist -Filter *.exe) {
            $signature = Get-AuthenticodeSignature $file.FullName
            "{0}: {1} ({2})" -f $file.Name, $signature.Status, $signature.SignerCertificate.Subject
            if ($signature.Status -ne "Valid") { $failed = $true }
          }
          if ($failed) { Write-Error "at least one installer is not validly signed"; exit 1 }

      # Say loudly, in the run summary, what this artifact actually is. An unsigned build
      # that looks finished is the failure mode worth engineering against.
      - name: Report what was built
        shell: bash
        env:
          # Only Windows can be signed today, so report per platform rather than echoing the input:
          # a run dispatched with `signing: production` still produces unsigned macOS and Linux
          # artifacts, and the summary has to say which is which.
          SIGNED: ${{ (inputs.signing == 'production' && matrix.os == 'windows-latest') && 'Cloud HSM (Authenticode)' || 'none' }}
        run: |
          set -euo pipefail
          {
            echo "### Production build — ${RUNNER_OS}"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| build type | \`production\` |"
            echo "| application id | \`${APP_ID}\` |"
            echo "| product name | \`${PRODUCT_NAME}\` |"
            echo "| packaged name (userData dir) | \`${APP_NAME}\` |"
            echo "| network channel | \`${EXPECTED_CHANNEL}\` |"
            echo "| signing | \`${SIGNED}\` |"
            echo "| auto-update | **off** (ENABLE_AUTO_UPDATE unset) |"
            echo "| published | **nothing** — \`-p never\`, no release step, \`contents: read\` |"
            echo
            if [ "${SIGNED}" != "Cloud HSM (Authenticode)" ]; then
              echo "> ⚠️ **UNSIGNED.** macOS Gatekeeper will refuse this build and Windows SmartScreen"
              echo "> will warn. Do not hand it to anyone outside the build owners."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # `latest*.yml` is electron-updater FEED METADATA. electron-builder writes it because
      # electron-builder.js always carries a `publish` block, but this lane publishes no
      # feed and auto-update is off, so it is deliberately not uploaded: an upload is not a
      # feed, and the surest way to keep it from becoming one is not to hand anyone the file.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ needs.config.outputs.wif_provider }}
          service_account: ${{ needs.config.outputs.service_account }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Upload installers to the private bucket
        shell: bash
        env:
          BUILD_BUCKET: ${{ needs.config.outputs.build_bucket }}
          OS: ${{ matrix.os }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release/dist/*.dmg release/dist/*.zip release/dist/*.AppImage release/dist/*.exe)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no installers found in release/dist"
            exit 1
          fi
          PREFIX="desktop/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/${OS}"
          gcloud storage cp --if-generation-match=0 "${files[@]}" "gs://${BUILD_BUCKET}/${PREFIX}/"
          {
            echo "### Installers stored privately"
            echo '```'
            for f in "${files[@]}"; do echo "gs://${BUILD_BUCKET}/${PREFIX}/$(basename "$f")"; done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
